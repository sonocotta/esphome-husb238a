      # - firmware/esphome/packages/monitoring.yaml
      # - firmware/esphome/packages/monitoring-wifi.yaml

# ===== HUSB238A (local component under test) =====

i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  scan: true
  frequency: 400kHz

external_components:
  - source:
      type: local
      path: ../esphome/components
    components: [ husb238a ]

husb238a:
  id: husb_01
  address: 0x42

binary_sensor:
  - platform: husb238a
    attached: "USB-PD Attached"

sensor:
  - platform: husb238a
    voltage: "Contracted Voltage"
    current: "Contracted Current"
    selected_voltage: "Selected Voltage"

text_sensor:
  - platform: husb238a
    status: "Last request status"
    capabilities: "Capabilities"

select:
  - platform: husb238a
    voltage: "Voltage selector"
